[project]
name = "stepik-git"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "selenium>=4.52.0",
]
[tool.pytest.ini_options]
markers = [
    "need_review: tests for the final review",
    "add_to_basket: add to basket tests",
    "basket: tests for the basket",
    "login_guest: guest login tests",
]